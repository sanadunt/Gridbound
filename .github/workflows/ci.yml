name: Verify Gridbound
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run database
      - run: git diff --exit-code -- data/database.json
      - run: npm run build
      - run: npm run balance
      - run: python3 scripts/package-hostinger.py
      - uses: actions/upload-artifact@v4
        with:
          name: gridbound-static
          path: dist/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: gridbound-hostinger
          path: |
            artifacts/Gridbound-Hostinger-*.zip
            artifacts/Gridbound-Hostinger-*.sha256
