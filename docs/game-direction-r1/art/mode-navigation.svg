<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Enter the game. Choose a different kind of journey.</title><desc id="desc">Gridbound R1 documentation concept. Not an implemented game screen.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#e6c78c"/></marker></defs><rect width="1000" height="640" fill="#10211d"/><text x="36" y="38" fill="#e6c78c" font-family="sans-serif" font-size="13" letter-spacing="2">GRIDBOUND / TARGET DESIGN R1</text><text x="36" y="76" fill="#f1ead7" font-family="sans-serif" font-size="26">Enter the game. Choose a different kind of journey.</text><path d="M500 170 V208" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 280 V310 H190 V348" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 280 V348" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 280 V310 H810 V348" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="102" width="340" height="68" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="346" y="131" fill="#f1ead7" font-family="sans-serif" font-size="18">PRESS START</text><text x="346" y="155" fill="#c1d2c7" font-family="sans-serif" font-size="14">One fresh input unlocks the title</text><rect x="330" y="214" width="340" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="346" y="243" fill="#f1ead7" font-family="sans-serif" font-size="18">MAIN MENU</text><text x="346" y="267" fill="#c1d2c7" font-family="sans-serif" font-size="14">Continue / Mode / Profile / Settings</text><rect x="40" y="354" width="300" height="72" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="56" y="383" fill="#f1ead7" font-family="sans-serif" font-size="18">STORY</text><text x="56" y="407" fill="#c1d2c7" font-family="sans-serif" font-size="14">Authored heroes / Gold + material</text><path d="M190 426 V470" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="354" width="300" height="72" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="366" y="383" fill="#f1ead7" font-family="sans-serif" font-size="18">ROGUELIKE</text><text x="366" y="407" fill="#c1d2c7" font-family="sans-serif" font-size="14">Build exactly 3 / Crystal run</text><path d="M500 426 V470" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><rect x="660" y="354" width="300" height="72" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="676" y="383" fill="#f1ead7" font-family="sans-serif" font-size="18">RAID BOSS</text><text x="676" y="407" fill="#c1d2c7" font-family="sans-serif" font-size="14">Build 1 to 6 / Certified contracts</text><path d="M810 426 V470" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="476" width="300" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="56" y="505" fill="#f1ead7" font-family="sans-serif" font-size="18">WORLD MAP</text><text x="56" y="529" fill="#c1d2c7" font-family="sans-serif" font-size="14">Party / Quest / Skills / Inventory</text><rect x="350" y="476" width="300" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="366" y="505" fill="#f1ead7" font-family="sans-serif" font-size="18">NODE MAP</text><text x="366" y="529" fill="#c1d2c7" font-family="sans-serif" font-size="14">Draft / Shop / Event / Challenge</text><rect x="660" y="476" width="300" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="676" y="505" fill="#f1ead7" font-family="sans-serif" font-size="18">BOSS BOARD</text><text x="676" y="529" fill="#c1d2c7" font-family="sans-serif" font-size="14">Rules / Preset / Practice vs Reward</text><text x