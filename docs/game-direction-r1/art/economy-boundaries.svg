<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">Separate economies. Shared theme, explicit ownership.</title><desc id="desc">Gridbound R1 documentation concept. Not an implemented game screen.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#e6c78c"/></marker></defs><rect width="1000" height="740" fill="#10211d"/><text x="36" y="38" fill="#e6c78c" font-family="sans-serif" font-size="13" letter-spacing="2">GRIDBOUND / TARGET DESIGN R1</text><text x="36" y="76" fill="#f1ead7" font-family="sans-serif" font-size="26">Separate economies. Shared theme, explicit ownership.</text><rect x="32" y="110" width="410" height="558" rx="8" fill="none" stroke="#9ddeba" stroke-dasharray="6 5"/><rect x="476" y="110" width="492" height="558" rx="8" fill="none" stroke="#adc9f1" stroke-dasharray="6 5"/><text x="50" y="144" fill="#9ddeba" font-family="sans-serif" font-size="17">STORY SLOT</text><text x="494" y="144" fill="#adc9f1" font-family="sans-serif" font-size="17">COMMANDER CHALLENGE</text><path d="M230 244 V280" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M230 348 V398" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 244 V280" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 348 V390" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><rect x="58" y="178" width="354" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="74" y="207" fill="#f1ead7" font-family="sans-serif" font-size="18">CHAPTERS + DUNGEON</text><text x="74" y="231" fill="#c1d2c7" font-family="sans-serif" font-size="14">Existing Story party / extraction</text><rect x="58" y="286" width="354" height="62" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="74" y="315" fill="#f1ead7" font-family="sans-serif" font-size="18">GOLD + MATERIALS</text><text x="74" y="339" fill="#c1d2c7" font-family="sans-serif" font-size="14">Owned by this Story slot</text><rect x="58" y="404" width="354" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="74" y="433" fill="#f1ead7" font-family="sans-serif" font-size="18">FORGE + SUPPLIES</text><text x="74" y="457" fill="#c1d2c7" font-family="sans-serif" font-size="14">Craft / upgrade / prepare</text><text x="58" y="546" fill="#9ddeba" font-family="sans-serif" font-size="18">No Crystal reward.</text><text x="58" y="578" fill="#c1d2c7" font-family="sans-serif" font-size="15">No shop or upgrade draft inside dungeon.</text><rect x="502" y="178" width="436" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="518" y="207" fill="#f1ead7" font-family="sans-serif" font-size="18">RAID + ROGUE CLEAR RECEIPTS</text><text x="518" y="231" fill="#c1d2c7" font-family="sans-serif" font-size="14">Validated contract / no duplicate payment</text><rect x="502" y="286" width="436" height="62" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="518" y="315" fill="#f1ead7" font-family="sans-serif" font-size="18">BANK CRYSTAL</text><text x="518" y="339" fill="#c1d2c7" font-family="sans-serif" font-size="14">Rule relic unlocks / mastery / cosmetics</text><rect x="502" y="396" width="436" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="518" y="425" fill="#f1ead7" font-family="sans-serif" font-size="18">ONE ROGUE RUN: RUN CRYSTAL</text><text x="518" y="449" fill="#c1d2c7" font-family="sans-serif" font-size="14">Room rewards → temporary shop + upgrades</text><text x="502" y="514" fill="#adc9f1" font-family="sans-serif" font-size="17">Bank cannot fund a run shop.</text><text x="502" y="548" fill="#c1d2c7" font-family="sans-serif" font-size="16">Leftover run purse resets: no conversion.</text><text x=