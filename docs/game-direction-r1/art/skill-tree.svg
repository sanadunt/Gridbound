<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="764" viewBox="0 0 1000 764" role="img" aria-labelledby="title desc"><title id="title">Skill prerequisites with breathing room.</title><desc id="desc">Gridbound R1 documentation concept. Not an implemented game screen.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#e6c78c"/></marker></defs><rect width="1000" height="764" fill="#10211d"/><text x="36" y="38" fill="#e6c78c" font-family="sans-serif" font-size="13" letter-spacing="2">GRIDBOUND / TARGET DESIGN R1</text><text x="36" y="76" fill="#f1ead7" font-family="sans-serif" font-size="26">Skill prerequisites with breathing room.</text><path d="M300 178 V204 H164 V230" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 178 V204 H448 V230" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M164 302 V332 H300 V366" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M448 302 V332 H300 V366" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 406 V438" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 510 V560" fill="none" stroke="#e6c78c" stroke-width="2" marker-end="url(#arrow)"/><rect x="200" y="110" width="200" height="68" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="216" y="139" fill="#f1ead7" font-family="sans-serif" font-size="18">STAND FAST</text><text x="216" y="163" fill="#c1d2c7" font-family="sans-serif" font-size="14">Foundation / learned</text><rect x="64" y="236" width="200" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="80" y="265" fill="#f1ead7" font-family="sans-serif" font-size="18">GUARD PATH</text><text x="80" y="289" fill="#c1d2c7" font-family="sans-serif" font-size="14">DEF + WIS</text><rect x="348" y="236" width="200" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="364" y="265" fill="#f1ead7" font-family="sans-serif" font-size="18">TEMPO PATH</text><text x="364" y="289" fill="#c1d2c7" font-family="sans-serif" font-size="14">DEX + STR</text><path d="M300 372 L318 389 L300 406 L282 389 Z" fill="#19342b" stroke="#e6c78c" stroke-width="2"/><text x="328" y="394" fill="#e6c78c" font-family="sans-serif" font-size="14">ALL</text><rect x="200" y="444" width="200" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="216" y="473" fill="#f1ead7" font-family="sans-serif" font-size="18">KEEP THE LINE</text><text x="216" y="497" fill="#c1d2c7" font-family="sans-serif" font-size="14">Inspect → learn</text><rect x="200" y="566" width="200" height="66" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="216" y="595" fill="#f1ead7" font-family="sans-serif" font-size="18">ULTRA TRIAL</text><text x="216" y="619" fill="#c1d2c7" font-family="sans-serif" font-size="14">Level + quest requirement</text><rect x="610" y="148" width="348" height="212" rx="6" fill="#19342b" stroke="#e6c78c" stroke-width="1.5"/><text x="626" y="177" fill="#f1ead7" font-family="sans-serif" font-size="18">SELECTED NODE</text><text x="626" y="201" fill="#c1d2c7" font-family="sans-serif" font-size="14">Aldric / personal signature</text><text x="626" y="232" fill="#9ddeba" font-family="sans-serif" font-size="18">Barrier • DEF + WIS</text><text x="626" y="268" fill="#f1ead7" font-family="sans-serif" font-size="16">Requires Guard AND Tempo</text><text x="626" y="300" fill="#c1d2c7" font-family="sans-serif" font-size="15">Inspect is free. Learn is explicit.</text><text x="626" y="332" fill="#c1d2c7" font-family="sans-serif" font-size="15">Full unmet gates stay readable.</text><text x="610" y="425" fill="#e6c78c" font-family="sans-serif" font-size="20">Spacing contract</text><text x="610" y="459" fill="#c1d2c7" font-family="sans-serif" font-size="16">Rows: at least 32 px</text><text x="610" y="490" fill="#c1d2c7" font-family="sans-serif" font-size="16">Columns: at least 24 px</text><text x="610" y="521" fill="#c1d2c7" font-family="sans-serif" font-size="16">Arrows stop before borders</text><text x="610" y="552" fill="#c1d2c7" font-family="sans-serif" font-size="16">No path through a text box</text><text x="610" y="583" fill="#c1d2c7" font-family="sans-serif" font-size="16">AND / OR / exclusion differ</text><text x="610" y="614" fill="#c1d2c7" font-family="sans-serif" font-size="16">Phone view: one branch at a time</text><text x="36" y="715" fill="#e6c78c" font-family="sans-serif" font-size="14">Illustrative graph, not a claim these exact nodes are implemented. Final layout must remeasure fonts.</text></svg>